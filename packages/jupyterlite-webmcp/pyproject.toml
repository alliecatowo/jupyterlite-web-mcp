[build-system]
requires = ["hatchling>=1.27", "jupyterlab>=4.0.0,<5", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "jupyterlite_webmcp"
# The version is single-sourced from package.json (see [tool.hatch.version]).
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# PEP 621 has no "contributors" field; Juan Mendoza is credited in package.json
# and the README.
authors = [{ name = "Allison Coleman", email = "me@allisons.dev" }]
maintainers = [{ name = "Allison Coleman", email = "me@allisons.dev" }]
description = "Expose the live JupyterLite workspace to a compatible browser agent through WebMCP."
keywords = ["jupyter", "jupyterlab", "jupyterlite", "webmcp", "mcp", "notebook"]
classifiers = [
  "Framework :: Jupyter",
  "Framework :: Jupyter :: JupyterLab",
  "Framework :: Jupyter :: JupyterLab :: 4",
  "Framework :: Jupyter :: JupyterLab :: Extensions",
  "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/alliecatowo/jupyterlite-web-mcp"
Repository = "https://github.com/alliecatowo/jupyterlite-web-mcp"
Issues = "https://github.com/alliecatowo/jupyterlite-web-mcp/issues"
Documentation = "https://github.com/alliecatowo/jupyterlite-web-mcp#readme"
Changelog = "https://github.com/alliecatowo/jupyterlite-web-mcp/blob/main/CHANGELOG.md"
Demo = "https://jupyterlite-web-mcp.vercel.app/lab/index.html"

[tool.hatch.version]
source = "nodejs"

[tool.hatch.build.hooks.version]
path = "jupyterlite_webmcp/_version.py"

[tool.hatch.build.targets.sdist]
artifacts = ["jupyterlite_webmcp/labextension"]
exclude = [".github", "node_modules"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlite_webmcp/labextension" = "share/jupyter/labextensions/jupyterlite-webmcp"
"install.json" = "share/jupyter/labextensions/jupyterlite-webmcp/install.json"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
  "jupyterlite_webmcp/labextension/static/style.js",
  "jupyterlite_webmcp/labextension/package.json"
]
skip-if-exists = ["jupyterlite_webmcp/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["npm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["npm"]
source_dir = "src"
build_dir = "jupyterlite_webmcp/labextension"

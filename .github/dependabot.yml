version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/jupyterlite-webmcp
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  # The demo site's JupyterLite build pins (requirements.txt).
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
  # Playwright for the browser tests.
  - package-ecosystem: npm
    directory: /ui-tests
    schedule: { interval: weekly }
    groups:
      ui-tests-minor-patch:
        update-types: [minor, patch]

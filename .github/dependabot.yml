version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/jupyterlite-webmcp
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # React is shared with JupyterLab (4.6 ships React 18); the extension must
      # stay on the same major or JupyterLab marks it incompatible.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # ts-jest does not support TypeScript 6 yet (every Jest suite fails to run),
      # and JupyterLab builds on TypeScript 5. Revisit when ts-jest supports TS 6.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  # The demo site's JupyterLite build pins (requirements.txt).
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
  # Playwright for the browser tests.
  - package-ecosystem: npm
    directory: /ui-tests
    schedule: { interval: weekly }
    groups:
      ui-tests-minor-patch:
        update-types: [minor, patch]
  # The VitePress docs site (docs/).
  - package-ecosystem: npm
    directory: /docs
    schedule: { interval: weekly }
    groups:
      docs-minor-patch:
        update-types: [minor, patch]

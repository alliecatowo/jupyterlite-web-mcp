name: Bot PR auto-merge

# Enables auto-merge on PRs opened by our maintenance bots (Dependabot, and
# Copilot's CodeQL autofixes only: other Copilot PRs get a normal review). No approval is involved: the `main` ruleset lets
# those bots bypass the required human review. GitHub then merges each one only
# once the required checks (build, test, analyze) pass, so a change that breaks
# the build or tests is never merged.
#
# Safety: uses pull_request_target, so it never checks out or runs code from
# the PR; it only acts on PRs authored by the bots below, from a branch in this
# repository (never a fork), and never on drafts.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       (github.event.pull_request.user.login == 'Copilot' &&
        startsWith(github.event.pull_request.head.ref, 'copilot/fix-code-scanning')))
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        # Dependabot major bumps are labelled for a human instead (next step).
        if: github.event.pull_request.user.login != 'dependabot[bot]' || steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label major updates for manual review
        if: github.event.pull_request.user.login == 'dependabot[bot]' && steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh label create major-update --color D93F0B --description "Major version bump, needs a human" 2>/dev/null || true
          gh pr edit "$PR_URL" --add-label major-update
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

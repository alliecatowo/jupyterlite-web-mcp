name: Bot PR auto-merge

# Enables auto-merge on PRs opened by our maintenance bots (Dependabot, and
# Copilot's CodeQL autofixes). No approval is involved: the `main` ruleset lets
# those bots bypass the required human review. GitHub then merges each one only
# once the required checks (build, test, analyze) pass, so a change that breaks
# the build or tests is never merged.
#
# Safety: uses pull_request_target, so it never checks out or runs code from
# the PR; it only acts on PRs authored by the bots below, from a branch in this
# repository (never a fork), and never on drafts.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       github.event.pull_request.user.login == 'Copilot')
    runs-on: ubuntu-24.04
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

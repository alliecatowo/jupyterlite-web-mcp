name: Site Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # jupyter-builder, which bundles the prebuilt labextension, is a console
      # script from the jupyterlab Python package, so it has to come first.
      - name: Install the extension build toolchain
        run: python -m pip install "jupyterlab~=4.6.0"

      - name: Build the extension
        run: |
          npm install
          npm run build:prod
        working-directory: packages/jupyterlite-webmcp

      - name: Install the dependencies
        run: python -m pip install -r requirements.txt

      - name: Build the JupyterLite site
        run: |
          jupyter lite build --contents content --output-dir dist

name: Site Build

# Builds the demo site exactly the way Vercel does (scripts/build-site.sh), so
# this check fails if the deployed site would ship without the extensions.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  # PRs share one group per branch (superseded runs are cancelled); every other
  # event gets its own group, so no push to main is ever dropped from the queue.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'latest'
          cache: npm
          cache-dependency-path: packages/jupyterlite-webmcp/package-lock.json

      - name: Build the JupyterLite site
        run: ./scripts/build-site.sh

name: Release

# Publishes jupyterlite-webmcp to PyPI with Trusted Publishing (OIDC): no API
# tokens or secrets. Setup lives on PyPI/TestPyPI ("pending publisher" with this
# workflow filename and the environment names below).
#
#   - Manual run (workflow_dispatch): build + smoke test, then publish to TestPyPI.
#   - Push a tag like v0.1.0: build + smoke test, publish to PyPI, then create
#     the GitHub Release for that tag with generated notes and the built files.
# Both publish jobs wait for approval on their GitHub environment.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(node -p "require('./packages/jupyterlite-webmcp/package.json').version")"
          test "v$pkg" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package.json version v$pkg"; exit 1; }

      - name: Build sdist and wheel
        working-directory: packages/jupyterlite-webmcp
        run: |
          python -m pip install build
          python -m build --outdir dist .

      - name: Smoke-test the built wheel in a fresh venv
        working-directory: packages/jupyterlite-webmcp
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl "jupyterlab>=4,<5"
          /tmp/smoke/bin/jupyter labextension list 2>&1 | tee /tmp/labext.txt
          grep -q "jupyterlite-webmcp.*enabled.*OK" /tmp/labext.txt

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/jupyterlite-webmcp/dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the extension build toolchain
        run: python -m pip install "jupyterlab~=4.6.0"

      - name: Install JS dependencies
        run: npm install
        working-directory: packages/jupyterlite-webmcp

      - name: Lint
        run: npm run lint:check
        working-directory: packages/jupyterlite-webmcp

      - name: Type check
        run: npm run typecheck
        working-directory: packages/jupyterlite-webmcp

      - name: Unit tests
        run: npm test
        working-directory: packages/jupyterlite-webmcp

      - name: Build the extension
        run: npm run build:prod
        working-directory: packages/jupyterlite-webmcp

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build the JupyterLite site
        run: jupyter lite build --contents content --output-dir dist

      - name: Install browser test dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium
        working-directory: ui-tests

      - name: Browser tests
        run: npx playwright test
        working-directory: ui-tests

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui-tests/playwright-report
          retention-days: 7

name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  # PRs share one group per branch (superseded runs are cancelled); every other
  # event gets its own group, so no push to main is ever dropped from the queue.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'latest'
          cache: npm
          cache-dependency-path: |
            packages/jupyterlite-webmcp/package-lock.json
            ui-tests/package-lock.json

      - name: Install the extension build toolchain
        run: python -m pip install "$(grep -i '^jupyterlab' requirements.txt)"

      - name: Install JS dependencies
        run: npm ci
        working-directory: packages/jupyterlite-webmcp

      - name: Lint
        run: npm run lint:check
        working-directory: packages/jupyterlite-webmcp

      - name: Type check
        run: npm run typecheck
        working-directory: packages/jupyterlite-webmcp

      - name: Unit tests
        run: npm test
        working-directory: packages/jupyterlite-webmcp

      - name: Build the extension
        run: npm run build:prod
        working-directory: packages/jupyterlite-webmcp

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build the JupyterLite site
        run: jupyter lite build --contents content --output-dir dist

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ui-tests

      - name: Browser tests
        run: npx playwright test
        working-directory: ui-tests

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: ui-tests/playwright-report
          retention-days: 7

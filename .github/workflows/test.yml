name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            packages/jupyterlite-webmcp/package-lock.json
            ui-tests/package-lock.json

      - name: Install the extension build toolchain
        run: python -m pip install "jupyterlab~=4.6.0"

      - name: Install JS dependencies
        run: npm ci
        working-directory: packages/jupyterlite-webmcp

      - name: Lint
        run: npm run lint:check
        working-directory: packages/jupyterlite-webmcp

      - name: Type check
        run: npm run typecheck
        working-directory: packages/jupyterlite-webmcp

      - name: Unit tests
        run: npm test
        working-directory: packages/jupyterlite-webmcp

      - name: Build the extension
        run: npm run build:prod
        working-directory: packages/jupyterlite-webmcp

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build the JupyterLite site
        run: jupyter lite build --contents content --output-dir dist

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ui-tests

      - name: Browser tests
        run: npx playwright test
        working-directory: ui-tests

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui-tests/playwright-report
          retention-days: 7
